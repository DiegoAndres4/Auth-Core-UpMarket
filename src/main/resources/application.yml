server:
  port: 8081

spring:
  application:
    name: authcore-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authcore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

authcore:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${AUTHCORE_JWT_EXPIRATION_MS:3600000}
  admin:
    # Contraseña inicial del usuario admin. Si se deja vacía se genera una aleatoria y se imprime UNA vez en el log.
    password: ${AUTHCORE_ADMIN_PASSWORD:}
